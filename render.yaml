services:
  - type: web
    name: tattoo-os
    runtime: node
    buildCommand: npm install
    startCommand: node backend/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/google-chrome-stable
      - key: RENDER_URL
        value: https://tattoo-os.onrender.com
    disk:
      name: tattoo-os-data
      mountPath: /data
      sizeGB: 1
