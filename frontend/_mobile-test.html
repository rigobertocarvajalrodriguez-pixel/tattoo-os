<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mobile Test — iPhone 16</title>
<style>
  :root{
    --sim-w: 393px;
    --sim-h: 852px;
    --sim-top: 59px;    /* safe-area-inset-top real del iPhone 16 (Dynamic Island + status bar) */
    --sim-bottom: 34px; /* safe-area-inset-bottom real del iPhone 16 (home indicator) */
    --sim-radius: 55px; /* esquinas redondeadas de pantalla, aproximado */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#1c1c1e}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:32px 16px;gap:14px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .meta{color:#8e8e93;font-size:12px;letter-spacing:.2px;text-align:center}
  .meta b{color:#e5e5ea}

  /* ══ BEZEL DEL DISPOSITIVO ══ */
  .device{
    position:relative;
    width:calc(var(--sim-w) + 18px);
    height:calc(var(--sim-h) + 18px);
    background:#0a0a0c;
    border-radius:calc(var(--sim-radius) + 9px);
    padding:9px;
    box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px #2c2c2e;
  }
  .screen{
    position:relative;
    width:var(--sim-w);
    height:var(--sim-h);
    border-radius:var(--sim-radius);
    overflow:hidden;
    background:#fff;
  }
  .screen iframe{
    position:absolute;inset:0;
    width:100%;height:100%;
    border:0;display:block;background:#fff;
  }

  /* ══ BARRA DE ESTADO (overlay encima del iframe, no bloquea toques salvo el pill) ══
     No es funcional (no muestra hora/batería reales) — solo ocupa visualmente el mismo
     espacio que ocupa en un iPhone real, para detectar contenido tapado detrás. */
  .status-bar{
    position:absolute;top:0;left:0;right:0;height:var(--sim-top);
    z-index:30;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 22px 7px;
    background:linear-gradient(to bottom, rgba(0,0,0,.32), rgba(0,0,0,0) 85%);
  }
  .status-time{
    font-size:15px;font-weight:600;color:#fff;letter-spacing:-.2px;
    text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .status-icons{display:flex;align-items:center;gap:5px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .status-icons svg{display:block}

  /* ══ DYNAMIC ISLAND ══
     126×37pt, centrado, ~11pt desde el borde superior — tamaño/posición real aproximada.
     Sin pointer-events:none a propósito: en un iPhone real esa zona tampoco es tocable. */
  .dynamic-island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:126px;height:37px;background:#000;border-radius:20px;
    z-index:31;box-shadow:0 0 0 1px rgba(255,255,255,.04);
  }

  /* ══ HOME INDICATOR ══ */
  .home-indicator-zone{
    position:absolute;bottom:0;left:0;right:0;height:var(--sim-bottom);
    z-index:30;pointer-events:none;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;
  }
  .home-indicator{
    width:134px;height:5px;border-radius:3px;
    background:#fff;opacity:.9;box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
  <div class="meta">📱 <b>Mobile Test</b> — iPhone 16 (<span id="meta-wh"></span>) · safe-area-inset real: top <b>59px</b> / bottom <b>34px</b> · cargando <b id="meta-path"></b></div>
  <div class="device">
    <div class="screen">
      <iframe id="fr" title="Mobile Test viewport"></iframe>
      <div class="status-bar">
        <span class="status-time" id="status-time">9:41</span>
        <span class="status-icons">
          <!-- señal -->
          <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff" aria-hidden="true"><rect x="0" y="7" width="3" height="5" rx="0.8"/><rect x="4.5" y="5" width="3" height="7" rx="0.8"/><rect x="9" y="3" width="3" height="9" rx="0.8"/><rect x="13.5" y="0" width="3" height="12" rx="0.8"/></svg>
          <!-- wifi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1 4.5a10 10 0 0 1 14 0"/><path d="M3.6 7.3a6.2 6.2 0 0 1 8.8 0"/><path d="M6.3 10a2.4 2.4 0 0 1 3.4 0"/></svg>
          <!-- batería -->
          <svg width="25" height="12" viewBox="0 0 25 12" fill="none" aria-hidden="true"><rect x="0.75" y="0.75" width="20.5" height="10.5" rx="2.5" stroke="#fff" stroke-opacity=".5" stroke-width="1"/><rect x="2.25" y="2.25" width="17.5" height="7.5" rx="1.5" fill="#fff"/><rect x="22.2" y="4" width="1.8" height="4" rx="1" fill="#fff" fill-opacity=".5"/></svg>
        </span>
      </div>
      <div class="dynamic-island"></div>
      <div class="home-indicator-zone"><div class="home-indicator"></div></div>
    </div>
  </div>

<script>
(function(){
  // ── Tamaño y ruta configurables por query string; el "chrome" de iPhone 16
  // (Dynamic Island / status bar / home indicator) es siempre el real del dispositivo,
  // independientemente del w/h pedido. ──
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w'), 10) || 393;
  var h = parseInt(q.get('h'), 10) || 852;
  var path = q.get('path') || '/app.html';
  var TOP = 59, BOTTOM = 34; // valores reales de safe-area-inset del iPhone 16

  document.documentElement.style.setProperty('--sim-w', w + 'px');
  document.documentElement.style.setProperty('--sim-h', h + 'px');
  document.getElementById('meta-wh').textContent = w + '×' + h + 'pt';
  document.getElementById('meta-path').textContent = path;

  var fr = document.getElementById('fr');

  // Como el navegador de escritorio no reporta un notch real, `env(safe-area-inset-*)`
  // siempre resuelve a 0 aquí. Para que la web probada dentro de este simulador quede
  // realmente sujeta a las mismas restricciones que en un iPhone físico, inyectamos las
  // variables --ios-sim-top/bottom/left/right en el <html> del iframe (mismo origen).
  // El CSS de la app debe leerlas como fallback antes de env(): p.ej.
  //   var(--ios-sim-top, env(safe-area-inset-top, 0px))
  // así en un iPhone real (sin esta variable) sigue usando el valor real del sistema.
  function injectSafeAreaVars(){
    try {
      var doc = fr.contentDocument;
      if (!doc || !doc.documentElement) return;
      doc.documentElement.style.setProperty('--ios-sim-top', TOP + 'px');
      doc.documentElement.style.setProperty('--ios-sim-bottom', BOTTOM + 'px');
      doc.documentElement.style.setProperty('--ios-sim-left', '0px');
      doc.documentElement.style.setProperty('--ios-sim-right', '0px');
    } catch (e) {
      console.warn('[mobile-test] No se pudo inyectar el safe-area simulado (¿la página es de otro origen?)', e);
    }
  }

  fr.addEventListener('load', function(){
    injectSafeAreaVars();
    // Reinyectar por si la propia app resetea estilos inline en <html> durante su init (SPA).
    setTimeout(injectSafeAreaVars, 300);
    setTimeout(injectSafeAreaVars, 1200);
  });

  fr.src = path;
})();
</script>
</body>
</html>
